<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My iOS Apps</title>
        <link rel="stylesheet" href="styles.css">
    </head>
<body>
    <div class="container">
        <h1>My iOS Apps</h1>
        <p class="subtitle">A collection of thoughtfully crafted iOS applications</p>

        <a href="#" class="app-card" target="_blank" rel="noopener">
            <div class="icon-container">
                <img src="images/happits-icon.png" alt="Happits" class="app-icon">
            </div>
            <div class="app-details">
                <div class="app-title">Happits: Happy Habits AI</div>
                <div class="app-description">Private, on-device habit building for a happier you!</div>
            </div>
            <span class="chevron">›</span>
        </a>

        <a href="https://apps.apple.com/us/app/my-khatma-quran-reader/id6670431429?utm_source=lp&utm_medium=lp&utm_campaign=launch" class="app-card" target="_blank" rel="noopener">
            <div class="icon-container">
                <img src="images/my-khatma-icon.png" alt="My Khatma - Holy Quran" class="app-icon">
            </div>
            <div class="app-details">
                <div class="app-title">My Khatma - Holy Quran</div>
                <div class="app-description">Your journey to completing the Quran.</div>
            </div>
            <span class="chevron">›</span>
        </a>

        <a href="https://apps.apple.com/app/apple-store/id6636491845?pt=80462&ct=homepage&mt=8" class="app-card" target="_blank" rel="noopener">
            <div class="icon-container">
                <img src="images/trio-icon.png" alt="Trio App - Simplify, Focus, Achieve" class="app-icon">
            </div>
            <div class="app-details">
                <div class="app-title">Trio: Simplify, Focus, Achieve</div>
                <div class="app-description">Your path to Mindful Productivity</div>
            </div>
            <span class="chevron">›</span>
        </a>
    </div>

    <!-- Background icons -->
    <div class="background-icons" id="backgroundIcons"></div>

    <script>
        // Add background icons
        const icons = ['★', '♥', '●', '◆', '▲', '■'];
        const container = document.getElementById('backgroundIcons');

        for (let i = 0; i < 50; i++) {
            const icon = document.createElement('div');
            icon.className = 'background-icon';
            icon.textContent = icons[Math.floor(Math.random() * icons.length)];
            icon.style.left = `${Math.random() * 100}%`;
            icon.style.top = `${Math.random() * 100}%`;
            icon.style.transform = `rotate(${Math.random() * 360}deg)`;
            container.appendChild(icon);
        }
    </script>
</body>
</html>
